<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Calendar Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Inline critical CSS for faster loading */
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
        }

        .header .back,
        .header .view-detail {
            font-size: 12pt;
            color: #00000075;
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            text-decoration: underline;
            text-decoration-color: #D5D5D580;
            text-underline-offset: 0.28em;
            text-decoration-thickness: 1px;
            transition: text-decoration-color 0.55s ease;
        }

        .header .back:hover,
        .header .view-detail:hover {
            text-decoration-color: #000000;
        }

        .header .back {
            cursor: pointer;
        }

        .header .view-detail {
            cursor: pointer;
        }

        .gallery {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            max-width: 1200px;
            margin: 20px;
            scroll-behavior: smooth;
            /* Smooth scrolling */
        }

        .gallery::-webkit-scrollbar {
            display: none;
            /* Hide scrollbar */
        }

        .gallery img {
            width: 100%;
            height: auto;
            display: block;
            scroll-snap-align: center;
            flex: 0 0 auto;
            max-width: 100%;
            max-height: 100%;
            transition: transform 0.3s ease;
            /* Smooth transition */
        }

        .gallery img:hover {
            transform: scale(1.01);
            /* Slightly enlarge on hover */
        }

        .minimap {
            display: flex;
            overflow-x: auto;
            gap: 5px;
            max-width: 1200px;
            margin: 10px 20px;
        }

        .minimap img {
            width: 80px;
            height: auto;
            cursor: pointer;
            opacity: 0.7;
            transition: opacity 0.3s ease, border 0.3s ease;
        }

        .minimap img:hover,
        .minimap img.active {
            opacity: 1;
            border: 1px solid #00000010;
        }
    </style>
</head>

<body>
    <div class="header">
        <div class="back" onclick="window.history.back()">
            Back
        </div>
        <div class="view-detail">
            <a href="https://interfacereview.substack.com" target="_blank">Read more</a>
        </div>
    </div>
    <div class="gallery" id="gallery">
        <img src="images/notion-calendar/notion-calendar-1.png" alt="Gallery Image 1">
        <img src="images/notion-calendar/notion-calendar-6.png" alt="Gallery Image 2">
        <img src="images/notion-calendar/notion-calendar-8.png" alt="Gallery Image 3">
        <img src="images/notion-calendar/notion-calendar-11.png" alt="Gallery Image 4">
        <img src="images/notion-calendar/notion-calendar-12.png" alt="Gallery Image 5">
        <!-- Add more images as needed -->
    </div>
    <div class="minimap">
        <img src="images/notion-calendar/notion-calendar-1.png" alt="Gallery Image 1" onclick="scrollToImage(0)">
        <img src="images/notion-calendar/notion-calendar-6.png" alt="Gallery Image 2" onclick="scrollToImage(1)">
        <img src="images/notion-calendar/notion-calendar-8.png" alt="Gallery Image 3" onclick="scrollToImage(2)">
        <img src="images/notion-calendar/notion-calendar-11.png" alt="Gallery Image 4" onclick="scrollToImage(3)">
        <img src="images/notion-calendar/notion-calendar-12.png" alt="Gallery Image 5" onclick="scrollToImage(4)">
        <!-- Add more images as needed -->
    </div>
    <script>
        function scrollToImage(index) {
            const gallery = document.querySelector('.gallery');
            const images = gallery.querySelectorAll('img');
            const minimapImages = document.querySelectorAll('.minimap img');
            images[index].scrollIntoView({ behavior: 'smooth', inline: 'center' });
            minimapImages.forEach(img => img.classList.remove('active'));
            minimapImages[index].classList.add('active');
        }

        function updateMinimap() {
            const gallery = document.querySelector('.gallery');
            const images = gallery.querySelectorAll('img');
            const minimapImages = document.querySelectorAll('.minimap img');
            let closestIndex = 0;
            let closestDistance = Infinity;

            images.forEach((img, index) => {
                const rect = img.getBoundingClientRect();
                const distance = Math.abs(rect.left - window.innerWidth / 2);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = index;
                }
            });

            minimapImages.forEach(img => img.classList.remove('active'));
            minimapImages[closestIndex].classList.add('active');
        }

        document.querySelector('.gallery').addEventListener('scroll', updateMinimap);

        // Set the first image as active by default
        document.querySelector('.minimap img').classList.add('active');
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notion Calendar by Cade Ross</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Inline critical CSS for faster loading */
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #fff;
            overflow: hidden;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #fff;
            overflow: hidden;
        }

        .header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            box-sizing: border-box;
            position: relative;
        }

        .header .back,
        .header .view-detail {
            font-size: 12pt;
            color: #00000075;
            font-family: 'Inter', sans-serif;
            font-weight: 100;
            text-decoration: underline;
            text-decoration-color: #D5D5D580;
            text-underline-offset: 0.28em;
            text-decoration-thickness: 1px;
            transition: text-decoration-color 0.55s ease;
        }

        .header .back:hover,
        .header .view-detail:hover {
            text-decoration-color: #000000;
        }

        .header .back {
            cursor: pointer;
        }

        .header .view-detail {
            cursor: pointer;
        }

        .gallery {
            display: flex;
            flex-direction: column;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            gap: 10px;
            height: 100vh;
            margin: 0;
            scroll-behavior: smooth;
            /* Smooth scrolling */
        }

        .gallery::-webkit-scrollbar {
            display: none;
            /* Hide scrollbar */
        }

        .gallery img {
            width: 100%;
            height: auto;
            max-height: 100vh;
            display: block;
            scroll-snap-align: start;
            flex: 0 0 auto;
            transition: transform 0.3s ease;
            /* Smooth transition */
            object-fit: contain;
        }

        /* Remove the hover effect */
        /* .gallery img:hover {
            transform: scale(1.01);
            /* Slightly enlarge on hover */
        /* } */
    </style>
</head>

<body>
    <div class="gallery" id="gallery">
        <img src="images/notion-calendar/notion-calendar-1.png" alt="Gallery Image 1">
        <img src="images/notion-calendar/notion-calendar-6.png" alt="Gallery Image 2">
        <img src="images/notion-calendar/notion-calendar-8.png" alt="Gallery Image 3">
        <img src="images/notion-calendar/notion-calendar-11.png" alt="Gallery Image 4">
        <img src="images/notion-calendar/notion-calendar-12.png" alt="Gallery Image 5">
        <!-- Add more images as needed -->
    </div>
    <script>
        function scrollToImage(index) {
            const gallery = document.querySelector('.gallery');
            const images = gallery.querySelectorAll('img');
            images[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function updateMinimap() {
            const gallery = document.querySelector('.gallery');
            const images = gallery.querySelectorAll('img');
            let closestIndex = 0;
            let closestDistance = Infinity;

            images.forEach((img, index) => {
                const rect = img.getBoundingClientRect();
                const distance = Math.abs(rect.top - window.innerHeight / 2);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = index;
                }
            });
        }

        document.querySelector('.gallery').addEventListener('scroll', updateMinimap);

        // Set the first image as active by default and center it on load
        window.addEventListener('load', () => {
            const firstImage = document.querySelector('.gallery img');
            firstImage.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    </script>
</body>

</html>
